[project]
name = "whispercpppy"
version = "0.1.2"
description = "Python wrapper around whisper.cpp server"
authors = [{ name = "zigai", email = "ziga.ivansek@gmail.com" }]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11.9", "requests>=2.32.5"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["whisper", "whisper-server", "whisper-cpp", "whisper-cpp-python"]

[project.scripts]
whispercpp-download = "whispercpppy.cli:model_cli"
whispercpp-download-vad = "whispercpppy.cli:vad_model_cli"

[project.optional-dependencies]
test = ["pytest>=9.0.3", "coverage>=7.14.1"]
dev = [
    "pytest>=9.0.3",
    "coverage>=7.14.1",
    "ruff==0.15.15",
    "pre-commit>=4.6.0",
    "pyrefly>=1.0.0",
    "codespell>=2.4.2",
    "rattle-lint>=1.3.0",
]

[project.urls]
Repository = "https://github.com/zigai/whisper.cpp.py"
Issues = "https://github.com/zigai/whisper.cpp.py/issues"
Homepage = "https://github.com/zigai/whisper.cpp.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whispercpppy"]

[tool.hatch.envs.test]
features = ["test"]
installer = "uv"

[[tool.hatch.envs.test.matrix]]
python = ["3.12", "3.13", "3.14"]

[tool.hatch.envs.test.scripts]
test = "pytest -v {args}"
cov = "coverage run -m pytest {args}"

[tool.coverage.run]
source = ["whispercpppy"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]
omit = ["tests/*", "tests/**"]

[tool.pyrefly]
project-includes = ["whispercpppy"]
project-excludes = ["tests/**"]
disable-project-excludes-heuristics = true
search-path = ["."]
disable-search-path-heuristics = true
python-version = "3.12"
enabled-ignores = ["type", "pyrefly"]
use-ignore-files = false
check-unannotated-defs = true
infer-return-types = "checked"
infer-with-first-use = true
strict-callable-subtyping = false
spec-compliant-overloads = false

[tool.codespell]
skip = ".git,uv.lock"

[tool.rattle]
root = true
enable = ["blank_lines"]
disable = ["rattle.rules"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ERA",
    "FBT002",
    "COM",
    "CPY",
    "DJ",
    "ANN003",
    "FIX",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D205",
    "D203",
    "D212",
    "E501",
    "PIE804",
    "S101",
    "EM101",
    "PYI041",
    "PYI051",
    "PYI046",
    "PYI047",
    "PYI049",
    "PYI053",
    "PYI054",
    "RET501",
    "SIM910",
    "N812",
    "PLC0415",
    "PLR0904",
    "PLR0913",
    "PLR2004",
    "PLR1711",
    "TRY003",
    "T20",
    "SIM105",
    "RET504",
    "PLR0912",
    "PLR0915",
    "SIM105",
    "TD",
    "TC001",
    "TC002",
    "TC003",
    "TC006",
    "PLW0603",
    "EM102",
    "PLW2901",
    "RSE102",
    "PGH004",
    "N806",
    "FBT001",
]
exclude = ["build"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401", # Unused import
    "E402", # Module import not at top of file
]
"**/tests/**/*.py" = [
    "S104",
    "S105",
    "S106",
    "TRY004",
    "RUF003",
    "RUF012",
    "UP031",
    "SLF001",
    "ARG",
    "N806",
    "ANN001",
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN401",
    "S",
    "SLF001",
    "INP001",
    "PLW0108",
    "EM102",
    "FBT001",
    "SIM300",
]
"examples/*.py" = ["INP001"]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
    "pydantic.validator",
    "declared_attr",
    "expression",
    "comparator",
]

[tool.ruff.lint.flake8-builtins]
ignorelist = ["id", "input"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "sqlalchemy.orm.DeclarativeBase",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["whispercpppy", "tests"]

[tool.ruff.lint.pydocstyle]
convention = "google"
